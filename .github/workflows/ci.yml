name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
      - run: npm run evaluate:first-day
      - run: npm run build
      - name: Generate Linux visual baselines
        run: npm run test:e2e -- e2e/visual-regression.spec.ts --project=desktop-chromium --update-snapshots
      - name: Upload Linux visual baselines
        uses: actions/upload-artifact@v4
        with:
          name: linux-visual-baselines
          path: e2e/visual-regression.spec.ts-snapshots/
          retention-days: 1
      - run: npm run test:e2e
      - run: npm run test:lighthouse
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
