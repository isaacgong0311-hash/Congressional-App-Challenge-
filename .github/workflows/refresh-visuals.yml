name: refresh-linux-visuals

on:
  push:
    branches: [codex/frontend-overhaul]

permissions:
  contents: read

jobs:
  snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/visual-regression.spec.ts --update-snapshots=all
      - uses: actions/upload-artifact@v4
        with:
          name: linux-visual-baselines
          path: e2e/visual-regression.spec.ts-snapshots/*-linux.png
          if-no-files-found: error
          retention-days: 1
